apiVersion: apps/v1
kind: Deployment
metadata:
  name: k-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k-bot
  template:
    metadata:
      labels:
        app: k-bot
    spec:
      containers:
      - name: k-bot-container
        image: nginxdemos/hello
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: k-bot-service
spec:
  type: NodePort
  selector:
    app: k-bot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
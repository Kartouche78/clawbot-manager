deploy.yamlname: Deploy K-Bot to Karakartal

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/k-bot:latest

      - name: Deploy to Kubernetes
        uses: steebchen/kubectl-gha@v1
        with:
          config: ${{ secrets.KUBECONFIG_DATA }}
          command: apply -f kbot.yaml